version: '3.8'
name: smarttodo
services:
  seq:
    image: datalust/seq:latest
    container_name: smarttodo-seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=SeqAdmin123!
    ports:
      - "5341:80"
      - "5342:5341"
    volumes:
      - seq-data:/data
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: uat-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: P@ssw0rd
      POSTGRES_DB: smarttodo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d smarttodo"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: smarttodo-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - Database__UsePostgreSQL=true
      - ConnectionStrings__PostgreSQL=Host=postgres;Port=5432;Database=smarttodo;Username=admin;Password=P@ssw0rd
      - Serilog__WriteTo__1__Name=Seq
      - Serilog__WriteTo__1__Args__serverUrl=http://seq:5341
      - Serilog__WriteTo__1__Args__apiKey=SmartTodoApiKey123
    ports:
      - "5208:8080"
    depends_on:
      postgres:
        condition: service_healthy
      seq:
        condition: service_started
    restart: unless-stopped

  webapp:
    build:
      context: ..
      dockerfile: Dockerfile.webapp
    container_name: smarttodo-webapp
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ApiSettings__BaseUrl=http://api:8080
      - Serilog__WriteTo__1__Name=Seq
      - Serilog__WriteTo__1__Args__serverUrl=http://seq:5341
      - Serilog__WriteTo__1__Args__apiKey=SmartTodoApiKey123
    ports:
      - "5209:8080"
    depends_on:
      - api
      - seq
    restart: unless-stopped

volumes:
  postgres-data:
  seq-data: